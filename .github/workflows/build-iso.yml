

name: Build Dolboeb OS ISO

on:
  workflow_dispatch:
  push:
    paths:
      - 'DolboebOS-ISO-Project.zip'
      - '.github/workflows/build-iso.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Install tools
        run: |
          pacman -Syu --noconfirm --needed \
            archiso git unzip findutils

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare profile
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/project
          mkdir -p "$GITHUB_WORKSPACE/out"
          mkdir -p /tmp/archiso-work

          unzip -q DolboebOS-ISO-Project.zip -d /tmp/project

          PROFILE_DEF="$(find /tmp/project \
            -type f -name profiledef.sh -print -quit)"

          if [ -z "$PROFILE_DEF" ]; then
            echo "ERROR: profiledef.sh not found!"
            exit 1
          fi

          PROFILE="$(dirname "$PROFILE_DEF")"
          RELENG="/usr/share/archiso/configs/releng"

          test -f "$PROFILE/packages.x86_64"
          test -d "$RELENG/syslinux"
          test -d "$RELENG/efiboot"

          echo "Found profile: $PROFILE"

          echo "Copying official boot configurations..."

          mkdir -p "$PROFILE/syslinux"
          cp -a "$RELENG/syslinux/." "$PROFILE/syslinux/"

          mkdir -p "$PROFILE/efiboot"
          cp -a "$RELENG/efiboot/." "$PROFILE/efiboot/"

          echo "Adding missing boot packages..."

          for package in syslinux edk2-shell memtest86+ memtest86+-efi; do
            if ! grep -qxF "$package" "$PROFILE/packages.x86_64"; then
              echo "$package" >> "$PROFILE/packages.x86_64"
            fi
          done

          echo "Creating Dolboeb OS profile..."

          cp "$RELENG/profiledef.sh" "$PROFILE/profiledef.sh"

          cat >> "$PROFILE/profiledef.sh" <<'EOF'

          iso_name="dolboeb-os"
          iso_label="DOLBOEB_OS"
          iso_publisher="Dolboeb OS"
          iso_application="Dolboeb OS - Arch Linux"
          iso_version="1.0"
          install_dir="dolboeb"
          EOF

          echo "Checking boot files..."

          test -f "$PROFILE/syslinux/syslinux.cfg"
          test -d "$PROFILE/efiboot/loader/entries"

          echo "PROFILE=$PROFILE" >> "$GITHUB_ENV"

          echo "Profile preparation successful!"

      - name: Build ISO
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting Dolboeb OS ISO build..."

          mkarchiso -v \
            -w /tmp/archiso-work \
            -o "$GITHUB_WORKSPACE/out" \
            "$PROFILE"

          echo "ISO BUILD SUCCESSFUL!"

          ls -lh "$GITHUB_WORKSPACE/out/"

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: DolboebOS-ISO
          path: out/*.iso
          if-no-files-found: error
          retention-days: 14
