

name: Build Ubludskaya OS ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Ublyudskaya OS 1.0
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project archive
        run: |
          set -eux
          test -f UblyudskayaOS-Project.zip

      - name: Build Debian 13 KDE ISO
        run: |
          set -eux

          docker run --privileged --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            debian:trixie \
            bash -euxo pipefail -c '

              export DEBIAN_FRONTEND=noninteractive

              apt-get update
              apt-get install -y \
                live-build \
                debootstrap \
                xorriso \
                squashfs-tools \
                isolinux \
                syslinux-common \
                grub-pc-bin \
                grub-efi-amd64-bin \
                dosfstools \
                mtools \
                rsync \
                unzip \
                ca-certificates

              echo "=== EXTRACTING PROJECT ==="

              mkdir -p /tmp/ublyud-project
              unzip -q /work/UblyudskayaOS-Project.zip \
                -d /tmp/ublyud-project

              PROJECT_ROOT="$(find /tmp/ublyud-project \
                -type f \
                -path "*/config/package-lists/desktop.list.chroot" \
                -print -quit | sed "s#/config/package-lists/desktop.list.chroot##")"

              if [ -z "$PROJECT_ROOT" ]; then
                echo "ERROR: Project configuration not found in ZIP"
                exit 1
              fi

              echo "Project found: $PROJECT_ROOT"

              cp -a "$PROJECT_ROOT/config" /work/config

              echo "=== CONFIGURING LIVE BUILD ==="

              lb config \
                --mode debian \
                --distribution trixie \
                --architectures amd64 \
                --binary-image iso-hybrid \
                --bootloaders "syslinux grub-efi" \
                --archive-areas "main contrib non-free non-free-firmware" \
                --debian-installer false \
                --apt-recommends true \
                --iso-application "Ublyudskaya OS 1.0" \
                --iso-publisher "Elupon / Ublyudskaya OS" \
                --iso-volume "UBLYUDOS_1" \
                --bootappend-live "boot=live components username=ublyud hostname=ublyud-os"

              echo "=== BUILDING ISO ==="

              lb build

              mkdir -p /work/out

              find . -maxdepth 1 -type f -name "*.iso" \
                -exec cp -v {} /work/out/ \;

              test -n "$(find /work/out -maxdepth 1 -name "*.iso" -print -quit)"

              echo "=== BUILD COMPLETE ==="
            '

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: UblyudskayaOS-ISO
          path: out/*.iso
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
