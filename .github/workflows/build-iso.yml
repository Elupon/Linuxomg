



name: Build Dolboeb OS ISO

on:
  workflow_dispatch:
  push:
    paths:
      - 'DolboebOS-ISO-Project.zip'
      - '.github/workflows/build-iso.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed \
            archiso git unzip findutils

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare complete Archiso profile
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/project "$GITHUB_WORKSPACE/out" /tmp/archiso-work

          unzip -q DolboebOS-ISO-Project.zip -d /tmp/project

          PROFILE_DEF="$(find /tmp/project \
            -type f -name profiledef.sh -print -quit)"

          if [[ -z "$PROFILE_DEF" ]]; then
            echo "::error::profiledef.sh not found!"
            find /tmp/project -maxdepth 5 -type f
            exit 1
          fi

          PROFILE="$(dirname "$PROFILE_DEF")"
          RELENG="/usr/share/archiso/configs/releng"

          test -f "$PROFILE/packages.x86_64"
          test -d "$RELENG/airootfs"
          test -d "$RELENG/syslinux"
          test -d "$RELENG/efiboot"

          echo "Profile: $PROFILE"

          # Restore official Arch live system files
          mkdir -p "$PROFILE/airootfs"
          cp -an "$RELENG/airootfs/." "$PROFILE/airootfs/"
          mkdir -p "$PROFILE/airootfs/root"

          # Restore official boot files
          mkdir -p "$PROFILE/syslinux" "$PROFILE/efiboot"

          cp -a "$RELENG/syslinux/." "$PROFILE/syslinux/"
          cp -a "$RELENG/efiboot/." "$PROFILE/efiboot/"

          # Replace obsolete Neofetch with Fastfetch
          sed -i '/^[[:space:]]*neofetch[[:space:]]*$/d' \
            "$PROFILE/packages.x86_64"

          if ! grep -qxF fastfetch "$PROFILE/packages.x86_64"; then
            echo fastfetch >> "$PROFILE/packages.x86_64"
          fi

          # Required boot packages
          for package in syslinux edk2-shell memtest86+ memtest86+-efi; do
            if ! grep -qxF "$package" "$PROFILE/packages.x86_64"; then
              echo "$package" >> "$PROFILE/packages.x86_64"
            fi
          done

          # Check every package before building
          while IFS= read -r package; do
            package="${package%%#*}"
            package="$(echo "$package" | xargs)"

            [[ -z "$package" ]] && continue

            if pacman -Si "$package" >/dev/null 2>&1; then
              continue
            fi

            if pacman -Sgq "$package" >/dev/null 2>&1; then
              continue
            fi

            echo "::error::Unavailable package: $package"
            exit 1
          done < "$PROFILE/packages.x86_64"

          # Official Archiso profile definition
          cp "$RELENG/profiledef.sh" "$PROFILE/profiledef.sh"

          cat >> "$PROFILE/profiledef.sh" <<'EOF'

          iso_name="dolboeb-os"
          iso_label="DOLBOEB_OS"
          iso_publisher="Dolboeb OS"
          iso_application="Dolboeb OS - Arch Linux"
          iso_version="1.0"
          install_dir="dolboeb"
          EOF

          echo "Final packages:"
          cat "$PROFILE/packages.x86_64"

          echo "PROFILE=$PROFILE" >> "$GITHUB_ENV"

      - name: Build ISO
        shell: bash
        run: |
          set -euo pipefail

          echo "BUILDING DOLBOEB OS..."

          mkarchiso -v \
            -w /tmp/archiso-work \
            -o "$GITHUB_WORKSPACE/out" \
            "$PROFILE"

          test -n "$(find "$GITHUB_WORKSPACE/out" \
            -maxdepth 1 -type f -name '*.iso' -print -quit)"

          ls -lh "$GITHUB_WORKSPACE/out/"*.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: DolboebOS-ISO
          path: out/*.iso
          if-no-files-found: error
          retention-days: 14
