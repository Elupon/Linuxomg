
name: Build Dolboeb OS ISO

on:
  workflow_dispatch:
  push:
    paths:
      - 'DolboebOS-ISO-Project.zip'
      - '.github/workflows/build-iso.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Install tools
        run: |
          pacman -Syu --noconfirm --needed \
            archiso git unzip findutils

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare profile
        shell: bash
        run: |
          set -e

          mkdir -p /tmp/project
          mkdir -p "$GITHUB_WORKSPACE/out"
          mkdir -p /tmp/archiso-work

          echo "Extracting Dolboeb OS..."

          unzip -q DolboebOS-ISO-Project.zip -d /tmp/project

          PROFILE_DEF="$(find /tmp/project \
            -type f -name profiledef.sh -print -quit)"

          if [ -z "$PROFILE_DEF" ]; then
            echo "ERROR: profiledef.sh not found!"
            find /tmp/project -maxdepth 4 -type f
            exit 1
          fi

          PROFILE="$(dirname "$PROFILE_DEF")"

          echo "Profile found: $PROFILE"

          if [ ! -f "$PROFILE/packages.x86_64" ]; then
            echo "ERROR: packages.x86_64 not found!"
            exit 1
          fi

          echo "Replacing broken profile definition..."

          cp /usr/share/archiso/configs/releng/profiledef.sh \
             "$PROFILE/profiledef.sh"

          cat >> "$PROFILE/profiledef.sh" <<'EOF'

          iso_name="dolboeb-os"
          iso_label="DOLBOEB_OS"
          iso_publisher="Dolboeb OS"
          iso_application="Dolboeb OS - Arch Linux"
          iso_version="1.0"
          install_dir="dolboeb"
          EOF

          echo "Checking profile..."
          test -f "$PROFILE/profiledef.sh"
          test -f "$PROFILE/packages.x86_64"

          echo "PROFILE=$PROFILE" >> "$GITHUB_ENV"

      - name: Build ISO
        shell: bash
        run: |
          set -e

          echo "Building DOLBOEB OS..."

          mkarchiso -v \
            -w /tmp/archiso-work \
            -o "$GITHUB_WORKSPACE/out" \
            "$PROFILE"

          echo "ISO build completed!"

          ls -lh "$GITHUB_WORKSPACE/out/"

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: DolboebOS-ISO
          path: out/*.iso
          if-no-files-found: error
          retention-days: 14
